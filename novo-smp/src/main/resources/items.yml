config-version: 5
currency-id: werkzeugfragment
custom-items:
  messages:
    player-not-found: <red>Spieler <white>%player%</white> ist nicht online.</red>
    unknown-item: '<red>Unbekanntes Item: <white>%item%</white></red>'
    count: <green><white>%player%</white> hat <yellow>%amount%x</yellow> <white>%item%</white>.</green>
    invalid-amount: <red>Ungültige Anzahl.</red>
    given: <green><yellow>%amount%x</yellow> <white>%item%</white> an <white>%player%</white> vergeben.%dropped%</green>
    not-enough: <red><white>%player%</white> hat nicht genug <white>%item%</white>.</red>
    taken: <green><yellow>%amount%x</yellow> <white>%item%</white> von <white>%player%</white> entfernt.</green>
    list-empty: <yellow>Es sind keine Custom-Items konfiguriert.</yellow>
    list: '<green>Custom-Items (%count%): %items%</green>'
    reloaded: <green>Custom-Items und Custom-Verzauberungen wurden neu geladen.</green>
    usage: <yellow>/%label% give|take <spieler>%item% [anzahl] • /%label% count <spieler>%item% • /%label% list • /%label% reload</yellow>
    librarian-seal-wrong-profession: <red>Das Bibliothekarsiegel funktioniert nur bei Bibliothekaren.</red>
    librarian-seal-already-traded: <red>Dieser Bibliothekar kann nicht mehr neu gewürfelt werden.</red>

infinite-rocket:
  enabled: true
  show-boost-actionbar: true
  menu:
    title: <dark_gray>Unendliche Rakete %level%</dark_gray>
  tiers:
    1:
      capacity: 2304
      flight-duration: 1
      combine-cost-levels: 5
    2:
      capacity: 4608
      flight-duration: 2
      combine-cost-levels: 10
    3:
      capacity: 6912
      flight-duration: 3

