settings:
  cache-ttl-millis: 30000
  request-poll-ticks: 20
  glow-refresh-ticks: 20
  movement-refresh-distance: 4.0

menus:
  list:
    title: '<white>Freunde</white>'
    size: 54
    page-size: 45
    slots:
      defaults: 45
      previous: 48
      requests: 49
      next: 50
      summary: 53
  requests:
    title: '<white>Freundesanfragen</white>'
    size: 54
    content-limit: 45
    back-slot: 45
  profile:
    title: '<white>Freund: <player></white>'
    size: 36
    slots:
      tpa: 4
      glow: 10
      chat: 12
      join-leave: 14
      friendly-fire: 16
      homes: 22
      reset: 25
      back: 27
      remove: 31
    materials:
      tpa: ENDER_PEARL
      glow: GLOW_INK_SAC
      chat: NAME_TAG
      join-leave: BELL
      friendly-fire: IRON_SWORD
      homes: RED_BED
      reset: REPEATER
  defaults:
    title: '<white>Freunde: Standard</white>'
    size: 27
    slots:
      allow-glow: 4
      glow: 10
      chat: 12
      join-leave: 14
      friendly-fire: 16
      back: 22
    materials:
      allow-glow: GLOW_BERRIES
      glow: GLOW_INK_SAC
      chat: NAME_TAG
      join-leave: BELL
      friendly-fire: IRON_SWORD
  homes:
    title: '<white>Home-Zugriff</white>'
    size: 27
    home-slots: [10, 11, 12, 13, 14, 15, 16]
    info-slot: 18
    back-slot: 22
    empty-slot: 13
    allowed-material: LIME_BED
    denied-material: RED_BED
  admin-players:
    title: '<white>Admin-Spieler</white>'
    size: 54
    page-size: 45
    slots:
      previous: 48
      summary: 49
      next: 50
  admin-homes:
    title: '<white>Admin-Homes: <player></white>'
    size: 27
    home-slots: [10, 11, 12, 13, 14, 15, 16]
    owner-slot: 18
    close-slot: 22
    empty-slot: 13

items:
  list:
    online:
      name: '<white><player></white>'
      lore:
        - '<green>Online</green>'
        - '<gray>Welt: <white><world></white></gray>'
        - '<dark_gray>Klicken für Einstellungen</dark_gray>'
    offline:
      material: SKELETON_SKULL
      name: '<white><player></white>'
      lore:
        - '<gray>Offline</gray>'
        - '<dark_gray>Klicken für Einstellungen</dark_gray>'
    defaults:
      name: '<white><player></white>'
      lore:
        - '<gray>Allgemeine Einstellungen</gray>'
        - '<dark_gray>Klicken zum Öffnen</dark_gray>'
    previous:
      material: ARROW
      name: '<white>Vorherige Seite</white>'
      lore: ['<gray>Seite <page> von <pages></gray>']
    requests:
      material: PAPER
      name: '<white>Freundesanfragen</white>'
      lore:
        - '<gray>Offene Anfragen: <white><count></white></gray>'
        - '<dark_gray>Klicken zum Öffnen</dark_gray>'
    next:
      material: ARROW
      name: '<white>Nächste Seite</white>'
      lore: ['<gray>Seite <page> von <pages></gray>']
    summary:
      material: BOOK
      name: '<white>Übersicht</white>'
      lore:
        - '<gray>Freunde: <white><count></white></gray>'
        - '<gray>Seite: <white><page>/<pages></white></gray>'
  request:
    name: '<white><player></white>'
    lore:
      - '<green>Linksklick: Annehmen</green>'
      - '<red>Rechtsklick: Ablehnen</red>'
  toggle:
    enabled:
      name: '<white><label></white>'
      lore:
        - '<green>Aktiviert</green>'
        - '<gray><description></gray>'
        - '<dark_gray>Klicken zum Umschalten</dark_gray>'
    disabled:
      name: '<white><label></white>'
      lore:
        - '<red>Deaktiviert</red>'
        - '<gray><description></gray>'
        - '<dark_gray>Klicken zum Umschalten</dark_gray>'
  tpa:
    name: '<white>TPA senden</white>'
    lore:
      - '<gray>Sendet diesem Freund eine</gray>'
      - '<gray>Teleportanfrage.</gray>'
  homes:
    name: '<white>Home-Zugriffe</white>'
    lore: ['<gray>Jedes Home einzeln erlauben</gray>']
  reset:
    name: '<white>Standards übernehmen</white>'
    lore:
      - '<gray>Setzt alle Einstellungen dieses Freundes</gray>'
      - '<gray>auf deine aktuellen allgemeinen Standards.</gray>'
  back:
    material: ARROW
    name: '<white>Zurück</white>'
    lore: ['<gray><destination></gray>']
  remove:
    material: BARRIER
    name: '<white>Freund entfernen</white>'
    lore: ['<red>Klicken zum Entfernen</red>']
  home:
    allowed:
      name: '<white><home></white>'
      lore:
        - '<green>Erlaubt</green>'
        - '<gray>Klicken zum Umschalten</gray>'
    denied:
      name: '<white><home></white>'
      lore:
        - '<red>Verboten</red>'
        - '<gray>Klicken zum Umschalten</gray>'
    empty:
      material: BARRIER
      name: '<white>Keine Homes vorhanden</white>'
      lore: ['<gray>Erstelle zuerst ein Home mit /sethome.</gray>']
    info:
      material: BOOK
      name: '<white>Home-Freigaben</white>'
      lore:
        - '<gray>Jedes Home gilt nur für</gray>'
        - '<gray>diesen einen Freund.</gray>'
  admin-player:
    enabled:
      name: '<white><player></white>'
      lore:
        - '<green>Glow: Aktiv</green>'
        - '<gray>Linksklick: Glow umschalten</gray>'
        - '<gray>Rechtsklick: Homes öffnen</gray>'
        - '<dark_gray>Welt: <world></dark_gray>'
    disabled:
      name: '<white><player></white>'
      lore:
        - '<red>Glow: Inaktiv</red>'
        - '<gray>Linksklick: Glow umschalten</gray>'
        - '<gray>Rechtsklick: Homes öffnen</gray>'
        - '<dark_gray>Welt: <world></dark_gray>'
  admin-summary:
    material: BOOK
    name: '<white>Spielerübersicht</white>'
    lore:
      - '<gray>Online: <white><count></white></gray>'
      - '<gray>Seite: <white><page>/<pages></white></gray>'
  admin-home:
    material: RED_BED
    name: '<white><home></white>'
    lore:
      - '<gray>Klicken zum Teleportieren</gray>'
      - '<dark_gray>Freigabe wird als Admin umgangen</dark_gray>'
  admin-home-empty:
    material: BARRIER
    name: '<white>Keine Homes vorhanden</white>'
    lore: ['<gray>Dieser Spieler besitzt keine Homes.</gray>']
  admin-owner:
    material: PLAYER_HEAD
    name: '<white><player></white>'
    lore: ['<gray>Homes: <white><count></white></gray>']
  close:
    material: BARRIER
    name: '<white>Schließen</white>'
    lore: ['<gray>Menü schließen</gray>']

