    volume: 0.65
    pitch: 0.75
  error:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 0.70
    pitch: 0.90

# Wird über /dueladmin kit ... verwaltet.
kits: {}

# Wird über eine WorldEdit-Auswahl und /dueladmin map ... verwaltet.
# Zusätzliche Kopien werden mit /dueladmin map addinstance <Map> <Instanz> angelegt.
# Dabei am entsprechenden Spawn-1-Punkt der kopierten Arena stehen; Umriss und Spawn 2
# werden automatisch aus dem Abstand zur Basis-Arena berechnet.
maps: {}
