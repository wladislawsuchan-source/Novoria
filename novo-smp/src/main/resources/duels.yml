# Sämtliche Duell-Sounds. Global oder pro Eintrag mit enabled: false deaktivierbar.
# "sound" akzeptiert Bukkit-Namen wie UI_BUTTON_CLICK oder Minecraft-Keys wie minecraft:ui.button.click.
sounds:
  enabled: true

  menu-open:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.45
    pitch: 1.20
  menu-click:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 0.45
    pitch: 1.15
  menu-back:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 0.45
    pitch: 0.85

  rule-enabled:
    enabled: true
    sound: BLOCK_LEVER_CLICK
    volume: 0.55
    pitch: 1.20
  rule-disabled:
    enabled: true
    sound: BLOCK_LEVER_CLICK
    volume: 0.55
    pitch: 0.80
  wager-set:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.65
    pitch: 1.30

  request-sent:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.70
    pitch: 1.25
  request-received:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.90
    pitch: 1.25
  request-accepted:
    enabled: true
    sound: BLOCK_BEACON_ACTIVATE
    volume: 0.75
    pitch: 1.25
  request-denied:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 0.70
    pitch: 0.90
  request-expired:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.55
    pitch: 0.75

  arena-teleport:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.55
    pitch: 1.10
  countdown-tick:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.00
    # Der Pitch steigt automatisch vom ersten bis zum letzten Countdown-Ton.
    pitch-first: 0.80
    pitch-last: 1.20
  fight-start:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.00
    pitch: 1.25
  time-warning:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL
    volume: 0.70
    pitch: 0.85
  blocked-action:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.55
    pitch: 0.65

  # Der Gewinner hört zuerst den Sieg-Sound und danach die kurze Klatsch-/Applaus-Sequenz.
  result-winner:
    enabled: true
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 0.45
    pitch: 1.00
  winner-applause:
    enabled: true
    sound: ENTITY_FIREWORK_ROCKET_TWINKLE
    volume: 0.90
