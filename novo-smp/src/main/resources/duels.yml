    volume: 0.80
    pitch: 0.60
  result-draw:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_IRON_XYLOPHONE
    volume: 0.80
    pitch: 0.80
  return-to-smp:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.50
    pitch: 0.85

  admin-success:
