# Aktives Angeln verwendet den normalen Vanilla-Hook und gilt für alle Spieler.
fishing:
  active:
    enabled: true
  night:
    start-tick: 13000
    end-tick: 23000
  biome-groups:
    river: ['*river']
    plains: [plains, sunflower_plains]
    forest: ['*forest']
    ocean: ['*ocean']
    swamp: [swamp, mangrove_swamp]
    cold: [frozen_river, frozen_ocean, deep_frozen_ocean]
  xp:
    base: 25
    color-multipliers:
      red: 1.0
      orange: 1.25
      yellow: 1.6
      green: 2.0
  combo:
    timeout-seconds: 60
    tiers:
      '5': 1.05
      '10': 1.10
      '20': 1.15
      '30': 1.20
  minigame:
    timeout-seconds: 5
    bar-width: 41
    easy:
      travel-time-seconds: 1.8
      green: 10.0
      yellow-each: 6.0
      orange-each: 8.0
      red-each: 12.0
    medium:
      travel-time-seconds: 1.4
      green: 8.0
      yellow-each: 4.0
      orange-each: 6.0
      red-each: 10.0
    hard:
      travel-time-seconds: 1.1
      green: 5.0
      yellow-each: 3.0
      orange-each: 4.5
      red-each: 8.0
  actionbar:
    pointer: '◆'
    segment: '▌'
    start: '<aqua>Ein Biss! Rechtsklick stoppt den Zeiger.</aqua>'
    gray: '<gray>GRAU • %fish% verfehlt | Combo: 0</gray>'
    red: '<red>ROT • %fish% • <aqua>+%xp% XP</aqua> | Combo: %combo% | Lager: %stored%/%capacity% | /fanglager</red>'
    orange: '<gold>ORANGE • %fish% • <aqua>+%xp% XP</aqua> | Combo: %combo% | Lager: %stored%/%capacity% | /fanglager</gold>'
    yellow: '<yellow>GELB • %fish% • <aqua>+%xp% XP</aqua> | Combo: %combo% | Lager: %stored%/%capacity% | /fanglager</yellow>'
    green: '<green>GRÜN • %fish% • <aqua>+%xp% XP</aqua> | Combo: %combo% | Lager: %stored%/%capacity% | /fanglager</green>'
    non-angler:
      red: '<red>ROT • %fish% | Combo: %combo%</red>'
      orange: '<gold>ORANGE • %fish% | Combo: %combo%</gold>'
      yellow: '<yellow>GELB • %fish% | Combo: %combo%</yellow>'
      green: '<green>GRÜN • %fish% | Combo: %combo%</green>'
    timeout: '<gray>Zeit abgelaufen • Combo zurückgesetzt.</gray>'

