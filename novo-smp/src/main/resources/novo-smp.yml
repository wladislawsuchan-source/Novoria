
# NovoSMP - nur SMP-spezifische Einstellungen
shared-folder: ../shared/NovoCore
spawn-world: smp_spawn
survival-worlds:
  - smp_world
  - smp_nether
  - smp_end

# Diese vier Welten bilden EINEN gemeinsamen SMP-Bereich (Tab, Chat, PM, Teleports).
worlds:
  smp:
    - smp_spawn
    - smp_world
    - smp_nether
    - smp_end

# Spielerschaden pro Welt steuern.
# true = normaler Schaden, false = diese Schadensart wird verhindert.
world-damage:
  smp_spawn:
    FLY_INTO_WALL: false
    # Verhindert sämtlichen Erstickungsschaden am Spawn – unabhängig von der Ursache.
    SUFFOCATION: false

# Komfortvorteile auf dem SMP. Premium und Premium+ nutzen absichtlich dieselbe Farbauswahl.
premium-features:
  chat-item:
    # Jeder Spieler darf sein gehaltenes Item mit [item] im Chat zeigen.
    enabled: true

velocity:
  this-server: smp
  hub-server: hub

crates:
  auto-recovery-enabled: false
  auto-recovery-radius: 128

# Einzigartiges, frei bewegliches Enderdrachen-Ei und King-Duelle.
dragon-egg-king:
  enabled: true
  world: smp_end
  time-zone: Europe/Berlin
  mandatory-duels-per-day: 3
  mandatory-challenge-cost: 20000
  mandatory-accept-timeout-seconds: 60
  challenge-timeout-seconds: 90
  challenger-cooldown-minutes: 5
  require-free-inventory-slot: true
  elytra-no-durability: true
  block-challenge-while-afk: true
  messages:
    disabled: '<red>Das King-System ist deaktiviert.</red>'
    no-active-king: '<red>Das Drachenei befindet sich aktuell nicht im Inventar eines Kings.</red>'
    duel-kit-missing: '<red>Das ausgewählte King-Duell-Kit ist nicht mehr verfügbar.</red>'
    self: '<red>Der King kann sich nicht selbst herausfordern.</red>'
    cooldown: '<red>Du kannst den King in <yellow>%seconds%</yellow> Sekunden erneut herausfordern.</red>'
    free-slot: '<red>Du brauchst mindestens einen freien Inventarplatz, um den King herauszufordern.</red>'
    king-afk: '<red>Der aktuelle King ist AFK und kann nicht herausgefordert werden.</red>'
    mandatory-sent: '<gold>⚔ Pflichtduell an <white>%king%</white> gesendet.</gold> <gray>Einsatz: <yellow>%cost% Coins</yellow></gray>'
    voluntary-sent: '<green>⚔ Freiwilliges King-Duell an <white>%king%</white> gesendet.</green>'
    mandatory-received: '<gold>⚔ Pflichtduell von <white>%player%</white>.</gold> <gray>Auto-Annahme in <yellow>%seconds%s</yellow>. <click:run_command:''/duel requests''><yellow>[Öffnen]</yellow></click></gray>'
    voluntary-received: '<yellow>⚔ Freiwilliges King-Duell von <white>%player%</white>.</yellow> <gray><click:run_command:''/duel requests''><yellow>[Öffnen]</yellow></click></gray>'
    combat-wait: '<yellow>Das King-Duell wartet, bis der normale Combat beendet ist.</yellow>'
    mandatory-no-deny: '<red>Ein offenes Pflichtduell kann nicht abgelehnt werden.</red>'
    limit-reached: '<red>Die Pflichtduelle dieser Regentschaft sind bereits erfüllt.</red>'
    insufficient: '<red>Du benötigst <yellow>%cost% Coins</yellow> für dieses Pflichtduell.</red>'
    king-changed: '<red>Das Drachenei befindet sich nicht mehr bei diesem King.</red>'
    won: '<gold>Du hast das kanonische Drachenei gewonnen und bist jetzt King.</gold>'
    lost: '<red>Du hast das Drachenei im King-Duell verloren.</red>'
    declined-target: '<gray>Du hast das freiwillige King-Duell abgelehnt.</gray>'
    declined-challenger: '<red>Der King hat deine freiwillige Herausforderung abgelehnt.</red>'
    expired-challenger: '<gray>Deine King-Herausforderung ist abgelaufen.</gray>'
    expired-king: '<gray>Die King-Herausforderung ist abgelaufen.</gray>'
    technical-abort: '<red>Das King-Duell wurde technisch abgebrochen. Dein Einsatz wurde erstattet.</red>'
    technical-abort-king: '<red>Das King-Duell wurde technisch abgebrochen.</red>'
    technical-refund-failed: '<red>Das King-Duell wurde technisch abgebrochen. Die Erstattung ist fehlgeschlagen – bitte melde dich beim Team.</red>'

# PvP-Combat und Citizens-Logout-Dummy. Trefferzustand bleibt ausschließlich im RAM;
# nur tatsächlich ausgeloggte Combat-Spieler werden bis zu ihrem nächsten Join gespeichert.
combat:
  duration-seconds: 20
  dummy-duration-seconds: 30
  actionbar:
    enabled: true
    update-ticks: 10
    text: '<red>⚔ Combat: <yellow>%seconds%s</yellow></red>'
  messages:
    command-blocked: '<dark_gray>[<red>Combat</red>]</dark_gray> <red>Dieser Befehl ist im Kampf noch <yellow>%seconds%s</yellow> gesperrt.</red>'
    dummy-killed: '<dark_gray>[<red>Combat</red>]</dark_gray> <red>Dein Combat-Dummy wurde getötet.</red>'
    dummy-friendly: '<dark_gray>[<red>Combat</red>]</dark_gray> <red>Du kannst den Combat-Dummy eines Freundes nicht angreifen.</red>'
  blocked-commands:
    - spawn
    - home
    - homes
    - fhome
    - back
    - rtp
    - hub
    - lobby
    - server
    - smp
    - tpa
    - tpaccept
    - tpyes
    - tp
    - ec
    - enderchest
    - ecupgrade
    - sell
    - ah
    - auctionhouse
    - order
    - orders
    - craft
    - condense
    - duel
    - duell
    - fly
    - gamemode
    - vanish
    - bau
    - invsee
    - invswap

# Persistente, vollständig durch Spielergeld finanzierte Kopfgelder.
bounty:
  enabled: true
  minimum-amount: 1000
  # -1 bedeutet unbegrenzt. Der Wert begrenzt eine einzelne Einzahlung.
  maximum-amount: -1
  allow-self-bounty: false
  allow-offline-targets: true
  payout:
    friends-can-claim: false
    duel-kills-can-claim: false
  gui:
    title: '<dark_gray>Kopfgelder</dark_gray>'
    rows: 6
    sort: HIGHEST_FIRST
    entry-name: '<yellow><bold>%player%</bold></yellow>'
    entry-lore:
      - ''
      - '<gray>Kopfgeld:</gray> <gold>%amount% Coins</gold>'
      - '<gray>Status:</gray> %status%'
    empty-name: '<gray>Keine Kopfgelder</gray>'
    empty-lore:
      - '<dark_gray>Momentan ist auf niemanden ein Kopfgeld ausgesetzt.</dark_gray>'
  announcements:
    enabled: true
    new-bounty: true
    bounty-increased: true
    bounty-claimed: true
  messages:
    new-bounty: '<dark_red>☠</dark_red> <red>Auf <yellow>%player%</yellow> wurde ein Kopfgeld von <gold>%amount% Coins</gold> ausgesetzt!</red>'
    bounty-increased: '<dark_red>☠</dark_red> <red>Das Kopfgeld auf <yellow>%player%</yellow> wurde auf <gold>%amount% Coins</gold> erhöht!</red>'
    bounty-claimed: '<dark_red>☠</dark_red> <red><yellow>%killer%</yellow> hat das Kopfgeld auf <yellow>%player%</yellow> kassiert: <gold>%amount% Coins</gold>!</red>'
  command:
    usage: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <gray>Benutzung: <yellow>/bounty [Spieler Betrag]</yellow></gray>'
    admin-usage: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <gray>Benutzung: <yellow>/bounty admin <set|add|remove|get> <Spieler> [Betrag]</yellow></gray>'
    success: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <green>Das Kopfgeld auf <yellow>%player%</yellow> beträgt jetzt <gold>%amount% Coins</gold>.</green>'
    target-not-found: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Dieser Spieler hat Novoria noch nie betreten.</red>'
    offline-not-allowed: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Das Ziel muss momentan online sein.</red>'
    self-not-allowed: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Du kannst kein Kopfgeld auf dich selbst setzen.</red>'
    below-minimum: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Der Mindestbetrag beträgt <gold>%amount% Coins</gold>.</red>'
    above-maximum: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Der maximale Einzelbetrag beträgt <gold>%amount% Coins</gold>.</red>'
    insufficient-funds: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Du besitzt nicht genügend Coins.</red>'
    invalid-amount: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Der Betrag muss eine gültige positive ganze Zahl sein.</red>'
    storage-error: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Die Bounty konnte wegen eines Datenbankfehlers nicht geändert werden.</red>'
    disabled: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Das Bounty-System ist momentan deaktiviert.</red>'
    player-only: '<red>Dieser Befehl ist nur für Spieler verfügbar.</red>'
    admin-get: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <gray>Kopfgeld auf <yellow>%player%</yellow>: <gold>%amount% Coins</gold>.</gray>'
    admin-success: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <green>Kopfgeld auf <yellow>%player%</yellow> %action%: <gold>%amount% Coins</gold>.</green>'
    admin-not-found: '<dark_gray>[<dark_red>Bounty</dark_red>]</dark_gray> <red>Auf diesem Spieler liegt kein Kopfgeld.</red>'

