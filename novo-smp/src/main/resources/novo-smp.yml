    # Illager/Raid
    EVOKER: false
    ILLUSIONER: false
    PILLAGER: true
    RAVAGER: true
    VINDICATOR: false
    WITCH: true

    # Golems
    COPPER_GOLEM: false
    IRON_GOLEM: false
    SNOW_GOLEM: false

    # Pferdeartige/Reittiere
    CAMEL: false
    DONKEY: true
    HORSE: true
    LLAMA: true
    MULE: false
    SKELETON_HORSE: true
    TRADER_LLAMA: false
    ZOMBIE_HORSE: true

    # Boss/Special
    ENDER_DRAGON: false
