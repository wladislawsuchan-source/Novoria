# Hauptmenü der Bestenlisten (/leaderboards)
leaderboards:
  # Namen oder UUIDs, die in keiner Bestenliste erscheinen sollen.
  hidden-players: []
  # Spieler mit weniger SMP-Spielzeit erscheinen in keiner Bestenliste.
  minimum-playtime-seconds: 60
  overall:
    enabled: true
    # Schlüssel aus leaderboards.menu.items; jede gültige Kategorie zählt einmal.
    included: [coins, kills, mob-kills, blocks-broken, blocks-placed, playtime, sell-earnings, lumis, active-days, prestige, heads-collected, advancements]
    player-head:
      name: '<yellow>#%rank% <white>%player%</white>'
      lore:
        - '<gray>Overall: <gold>%average%'
        - '<gray>Gewertete Kategorien: <yellow>%categories%'
    own-head:
      name: '<gold>Dein Overall</gold>'
      lore:
        - '<gray>Overall: <gold>%average%'
        - '<gray>Platz: <green>%rank% <dark_gray>/ %total%'
        - '<gray>Gewertete Kategorien: <yellow>%categories%'
  menu:
    title: '<dark_gray>Bestenlisten</dark_gray>'
    rows: 4
    filler:
      enabled: false
      material: GRAY_STAINED_GLASS_PANE

    # Auch die Bestenlisten-Kategorien werden ausschließlich hier definiert.
    # Entfernen/disabled = keine Kategorie im Menü. Slot/Material/Name/Lore kommen 1:1 aus dieser Datei.
