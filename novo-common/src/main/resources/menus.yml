rtp:
  enabled: true
  world: smp_world
  min-radius: 2500
  max-radius: 20000
  max-attempts: 64
  # Lädt mehrere Kandidaten parallel und verkürzt dadurch die Suchzeit deutlich.
  search-batch-size: 4
  # Kleine Queue aus vorab geprüften RTP-Zielen. Speichert nur Locations, keine Chunks.
  prepared-locations: 8
  prepared-search-attempts: 32
  prepared-refill-delay-ticks: 10
  preload-chunk-radius: 1
  preload-hold-ticks: 80
  cooldown-seconds: 60
  delay-seconds: 3
  cancel-on-move: true
  actionbar: <yellow>Teleport in <green>%seconds%s</green>
  search-actionbar: <yellow>Sicherer Ort wird gesucht...</yellow>
  unsafe-blocks:
  - WATER
  - LAVA
  - FIRE
  - SOUL_FIRE
  - MAGMA_BLOCK
  - CACTUS
  - SWEET_BERRY_BUSH
  - POWDER_SNOW
  - CAMPFIRE
  - SOUL_CAMPFIRE
  worlds:
    overworld: smp_world
    nether: smp_nether
    end: smp_end
  menu:
    title: '&8RTP-Auswahl'
    rows: 3
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    items:
      overworld:
        slot: 11
        material: GRASS_BLOCK
        name: '&a&lOverworld'
        lore:
        - '&7Grenze: &e100.000 x 100.000'
        - ''
        - '&aKlicke, um zufällig teleportiert zu werden'
      nether:
        slot: 13
        material: NETHERRACK
        name: '&c&lNether'
        lore:
        - '&7Grenze: &e100.000 x 100.000'
        - ''
        - '&aKlicke, um zufällig teleportiert zu werden'
      end:
        slot: 15
        material: END_STONE
        name: '&d&lEnd'
        lore:
        - '&7Grenze: &e100.000 x 100.000'
        - ''
        - '&aKlicke, um zufällig teleportiert zu werden'

# Persönliches Statistikmenü (/stats)
stats:
  menu:
    title: '<dark_gray>Deine Statistiken</dark_gray>'
    other-title: '<dark_gray>Statistiken von <white>%player%</white></dark_gray>'
    rows: 4

    # Kompakte Anzeige: 1.500 -> 1.5K, 1.500.000 -> 1.5M
    number-format:
      compact: true
      decimals: 1
      decimal-separator: '.'
      suffixes:
        thousand: 'K'
        million: 'M'
        billion: 'B'
        trillion: 'T'

    filler:
      enabled: false
      material: GRAY_STAINED_GLASS_PANE

    # Die sichtbaren Stats werden AUSSCHLIESSLICH hier definiert.
    # Entfernst du einen Block oder setzt enabled: false, verschwindet der Stat aus /stats.
    # Java verschiebt keine Slots mehr und fügt keine Kategorien automatisch hinzu.
    #
    # stat-Datenquellen:
    # coins, lumis, active-days, kills, deaths, mobs-killed, blocks-mined,
    # blocks-placed, playtime-seconds, sell-earnings, advancements, prestige, heads-collected
    # format: number | playtime
    items:
      coins:
        stat: coins
        format: number
        slot: 10
        material: SUNFLOWER
        name: '<gold>Coins</gold>'
        lore:
          - '<gray>Coins: <gold>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      kills:
        stat: kills
        format: number
        slot: 11
        material: IRON_SWORD
        name: '<red>Kills</red>'
        lore:
          - '<gray>Kills: <red>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      mob-kills:
        stat: mobs-killed
        format: number
        slot: 12
        material: CREEPER_HEAD
        name: '<green>Mob-Kills</green>'
        lore:
          - '<gray>Mob-Kills: <green>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      blocks-broken:
        stat: blocks-mined
        format: number
        slot: 13
        material: DIAMOND_PICKAXE
        name: '<aqua>Abgebaute Blöcke</aqua>'
        lore:
          - '<gray>Abgebaut: <aqua>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      blocks-placed:
        stat: blocks-placed
        format: number
        slot: 14
        material: OAK_LOG
        name: '<yellow>Platzierte Blöcke</yellow>'
        lore:
          - '<gray>Platziert: <yellow>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      playtime:
        stat: playtime-seconds
        format: playtime
        slot: 15
        material: CLOCK
        name: '<yellow>Spielzeit</yellow>'
        lore:
          - '<gray>Spielzeit: <yellow>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      sell-earnings:
        stat: sell-earnings
        format: number
        slot: 16
        material: GOLD_INGOT
        name: '<gold>Mit /sell verdient</gold>'
        lore:
          - '<gray>Verdient: <gold>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'

      # Untere Reihe. Ab dem Sensor wie gewünscht eine Position weiter links.
      lumis:
        stat: lumis
        format: number
        slot: 20
        material: AMETHYST_SHARD
        name: '<light_purple>Lumis</light_purple>'
        lore:
          - '<gray>Lumis: <light_purple>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      active-days:
        stat: active-days
        format: number
        slot: 21
        material: DAYLIGHT_DETECTOR
        name: '<light_purple>Aktive Tage</light_purple>'
        lore:
          - '<gray>Aktive Tage: <light_purple>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      prestige:
        stat: prestige
        format: number
        slot: 22
        material: BEACON
        name: '<gold>Prestige</gold>'
        lore:
          - '<gray>Prestige insgesamt: <gold>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      heads-collected:
        stat: heads-collected
        format: number
        slot: 23
        material: PLAYER_HEAD
        name: '<light_purple>Köpfe gesammelt</light_purple>'
        lore:
          - '<gray>Einzigartige Köpfe: <light_purple>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      advancements:
        stat: advancements
        format: number
        slot: 24
        material: NETHER_STAR
        name: '<light_purple>Advancements</light_purple>'
        lore:
          - '<gray>Abgeschlossen: <light_purple>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'
      deaths:
        stat: deaths
        format: number
        slot: 25
        material: SKELETON_SKULL
        name: '<red>Tode</red>'
        lore:
          - '<gray>Tode: <red>%value%'
          - '<gray>Rang: <yellow>#%rank% <dark_gray>/ %total%'

# Verfügbare Platzhalter in name/lore:
# %value% = formatierter Wert, %rank% = eigener Rang, %total% = Spieleranzahl


