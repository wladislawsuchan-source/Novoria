vanish:
  visuals:
    tab:
      enabled: true
      name-color: '#777777'
      italic: true
    nametag:
      enabled: true
      marker: '<red><bold>V</bold></red> '
debug:
  tablist-visibility: false
void-rescue:
  message:
    enabled: false
    text: <red>Du wurdest aus dem Void gerettet.
  enabled: true
  hub-min-y: 50
  smp-spawn-min-y: -10
settings:
  send-to-hub-on-join: true
  save-last-smp-location: true
  use-smp-spawn-as-fallback: true
  teleport-delay-seconds: 0
  cancel-on-move: false
spawn:
  heal-on-teleport: true
  restore-food-on-teleport: true
  clear-fire-on-teleport: true
  delay-seconds: 3
  cancel-on-move: true
  actionbar: <yellow>Teleport in <green>%seconds%s</green>...
homes:
  default-limit: 3
  # Creator ist der frühere Content-Rang. Er erhält 7 Homes.
  group-limits:
    creator: 7
  max-name-length: 16
  delay-seconds: 3
  cancel-on-move: true
  actionbar: <yellow>Teleport in <green>%seconds%s</green>...
  safety-warning:
    enabled: true
    # Der Teleport wird NICHT blockiert. Der Spieler bekommt nur eine Warnung.
    dangerous-blocks:
      - LAVA
      - FIRE
      - SOUL_FIRE
      - MAGMA_BLOCK
      - CACTUS
      - CAMPFIRE
      - SOUL_CAMPFIRE
      - POWDER_SNOW
      - SWEET_BERRY_BUSH
      - WITHER_ROSE
      - POINTED_DRIPSTONE
tpa:
  request-timeout-seconds: 60
  friends-bypass-teleport-delay: true
  delay-seconds: 3
  cancel-on-move: true
  actionbar: <yellow>Teleport in <green>%seconds%s</green>...
