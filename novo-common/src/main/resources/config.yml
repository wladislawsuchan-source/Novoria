# Refer-a-Friend (/ref)
referral:
  enabled: true
  # Ein Referral-Code kann nur verwendet werden, solange der Spieler weniger als diese Spielzeit hat.
  # 3600 = 1 Stunde. 0 deaktiviert die Zeitgrenze.
  max-redeem-playtime-seconds: 3600
  novo-crate-id: novo

  # Der Code wird zuerst nur vorgemerkt. Erfolgreich wird die Empfehlung erst,
  # wenn der neue Spieler ALLE drei Aktivitätswerte erreicht hat.
  verification:
    blocks-mined: 100
    mob-kills: 10
    advancements: 3

  menu:
    title: "<dark_gray>Refer a Friend</dark_gray>"
  point-shop:
    # 1 erfolgreicher Referral = 1 Punkt, 1 Punkt = 1 Novo-Key.
    novo-key-price: 1
