    pvp: false
    block-break: false
    block-place: false
    interact: false
    chest-access: false
    damage-animals: false
    sleep: false
    respawn-anchors: false
    tnt: false
  smp-spawn:
    other-explosions: false
    fire-spread: false
    entity-block-change: false
    mob-spawning: false
    enabled: true
