# 11.13.4 Crate-Animation
crates:
  idle-effects:
    enabled: true
    # Partikel werden nur an Spieler innerhalb dieser Distanz gesendet.
    view-distance: 18.0
    # Kleiner = flüssiger, größer = sparsamer. 2 Ticks ist ein guter Standard.
    period-ticks: 2
    # Entfernung der Aura vom Mittelpunkt der Shulkerbox.
    # Die vorherigen festen Werte lagen teilweise innerhalb des Blocks.
    radius:
      min: 0.95
      max: 1.35
    # Vertikale Abweichung relativ zum Aura-Mittelpunkt.
    height:
      min-offset: -0.48
      max-offset: 0.68
    # Die Kreisbahn kippt ständig zwischen diesen Winkeln.
    tilt:
      min-degrees: 10.0
      max-degrees: 42.0
    # Mehrere passende Farben wechseln sich auf leicht verschiedenen Bahnen ab.
    # Farben können hier jederzeit als Hex-Werte angepasst werden.
    colors:
      lumi: ["#F5C437", "#FFE36A", "#F39A2E", "#FFF4C2"]
      vanta: ["#74131F", "#A51F2D", "#D13A43", "#4A1620"]
      daily: ["#975B30", "#D77A2B", "#C99A3D", "#F1B84B"]
    particles:
      # Drei unterschiedlich geneigte Ringe mit jeweils mehreren Punkten.
      rings: 3
      normal-per-ring: 7
      with-key-per-ring: 10
      # Zusätzliche Partikel schweben frei zwischen den Ringen.
      floating: 4
      floating-with-key: 6
      size: 0.82
      key-size: 1.00
      # Kleiner, privater Partikelstoß in regelmäßigen Abständen.
      # 0 deaktiviert die jeweilige Funktion.
      burst-interval-ticks: 60
      burst-count: 8
    key-boost:
      speed-multiplier: 1.30
  animation:
    item-display:
      # Position relativ zur unteren Ecke der Shulkerbox.
      offset-x: 0.5
      offset-y: 1.05
      offset-z: 0.5
      # 1.0 = normale ItemDisplay-Größe. Kleinerer Wert = kleineres Item.
      scale: 0.60
      view-range: 0.60

# 11.13.9 Konfigurierbare mehrfarbige Crate-Aura
# Diese Werte werden jetzt wirklich vom Code ausgelesen.
# Radius ist die Entfernung vom Mittelpunkt der Shulkerbox.
crates-idle-effects-reference:
  note: "Die aktiven Werte stehen unter crates.idle-effects. Dieser Abschnitt ist
    nur ein Hinweis und kann entfernt werden."


