
gameplay:
  chat-mention:
    enabled: true
    # Nur der erwähnte Spieler sieht seinen Namen als gelbes @Name.
    highlight:
      enabled: true
      prefix: "@"
  invisibility-anonymity:
    enabled: true
    # Solange der Spieler unsichtbar ist, sehen Nicht-Freunde diesen anonymen Namen im öffentlichen Chat.
    # Freunde sehen die echte Identität immer. Zusätzlich deckt eine Wasserflasche den Spieler nur für den Werfer auf.
    chat-name: "<gray>Anonym</gray>"
economy:
  messages:
    no-permission: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dafür hast 
      du keine Berechtigung.</red>
    unavailable: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Die Economy 
      ist momentan nicht verfügbar.</red>
  balance:
    messages:
      player-only: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser 
        Befehl ist nur für Spieler verfügbar.</red>
      usage: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Benutzung: <yellow>/balance</yellow></gray>'
      result: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du besitzt 
        <green>%balance% Coins</green>.</gray>
  pay:
    messages:
      player-only: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser 
        Befehl ist nur für Spieler verfügbar.</red>
      usage: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Benutzung: <yellow>/pay
        <Spieler> <Betrag></yellow></gray>'
      player-not-found: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser 
        Spieler ist nicht online.</red>
      self: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Du kannst dir nicht
        selbst Coins senden.</red>
      invalid-amount: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Der 
        Betrag muss eine positive ganze Zahl sein.</red>
      insufficient-funds: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Du 
        besitzt nicht genügend Coins.</red>
      storage-error: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Die 
        Überweisung konnte nicht gespeichert werden.</red>
      sent: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du hast 
        <yellow>%player%</yellow> <green>%amount% Coins</green> gesendet.</gray>
      received: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du hast von 
        <yellow>%player%</yellow> <green>%amount% Coins</green> erhalten.</gray>
  admin:
    messages:
      usage: '<dark_gray>[<red>TEAM</red>]</dark_gray> <gray>Benutzung: <yellow>/eco
        <give|take|set> <Spieler> <Betrag></yellow></gray>'
      player-not-found: '<dark_gray>[<red>TEAM</red>]</dark_gray> <red>Der Spieler
        <yellow>%player%</yellow> wurde nicht gefunden.</red>'
      invalid-amount: '<dark_gray>[<red>TEAM</red>]</dark_gray> <red>Der Betrag muss
        eine gültige ganze Zahl sein.</red>'
      insufficient-funds: '<dark_gray>[<red>TEAM</red>]</dark_gray> <red><yellow>%player%</yellow>
        besitzt nicht genügend Coins.</red>'
      storage-error: '<dark_gray>[<red>TEAM</red>]</dark_gray> <red>Die Änderung konnte
        wegen eines Datenbankfehlers nicht gespeichert werden.</red>'
      give-success: '<dark_gray>[<red>TEAM</red>]</dark_gray> <green>Du hast <yellow>%player%</yellow>
        <yellow>%amount% Coins</yellow> gegeben. Neuer Kontostand: <yellow>%balance%
        Coins</yellow>.</green>'
      take-success: '<dark_gray>[<red>TEAM</red>]</dark_gray> <green>Du hast <yellow>%player%</yellow>
        <yellow>%amount% Coins</yellow> abgezogen. Neuer Kontostand: <yellow>%balance%
        Coins</yellow>.</green>'
      set-success: '<dark_gray>[<red>TEAM</red>]</dark_gray> <green>Du hast den Kontostand
        von <yellow>%player%</yellow> auf <yellow>%balance% Coins</yellow> gesetzt.</green>'
      target-give: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Dir wurden <green>%amount%
        Coins</green> gutgeschrieben.</gray>'
      target-take: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Dir wurden <red>%amount%
        Coins</red> abgezogen.</gray>'
      target-set: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Dein Kontostand
        wurde auf <green>%balance% Coins</green> gesetzt.</gray>'
  sell:
    messages:
      player-only: '<dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser Befehl
        ist nur für Spieler verfügbar.</red>'
      usage: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Benutzung: <yellow>/sell</yellow></gray>'
      nothing-to-sell: '<dark_gray>[<green>SMP</green>]</dark_gray> <red>Es befinden
        sich keine verkaufbaren Items im Menü.</red>'
      failed: '<dark_gray>[<green>SMP</green>]</dark_gray> <red>Der Verkauf konnte
        nicht gespeichert werden.</red>'
      success: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du hast <yellow>%items%</yellow>
        Items für <green>%coins% Coins</green> verkauft.</gray>'

kill:
  messages:
    usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/kill
      [Spieler]</yellow></gray>'
    no-permission-others: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du 
      darfst keine anderen Spieler töten.</red>
    player-not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Dieser 
      Spieler ist nicht online.</red>
ping:
  messages:
    player-only: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser Befehl 
      ist nur für Spieler verfügbar.</red>
    usage: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Benutzung: <yellow>/ping</yellow></gray>'
    result: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Dein Ping beträgt 
      <green>%ping% ms</green>.</gray>
afk:
  automatic:
    enabled: true
    minutes: 5
  check-interval-ticks: 200
  tab:
    enabled: true
    format: '<gray>(ᴀꜰᴋ)</gray> '
  messages:
    player-only: <dark_gray>[<green>SMP</green>]</dark_gray> <red>Dieser Befehl 
      ist nur für Spieler verfügbar.</red>
    usage: '<dark_gray>[<green>SMP</green>]</dark_gray> <gray>Benutzung: <yellow>/afk</yellow></gray>'
    enabled: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du bist jetzt 
      AFK.</gray>
    automatic-enabled: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du 
      wurdest wegen Inaktivität auf AFK gesetzt.</gray>
    disabled: <dark_gray>[<green>SMP</green>]</dark_gray> <gray>Du bist nicht 
      mehr AFK.</gray>
moderation:
  history:
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/history
        <Spieler> [Seite]</yellow></gray>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      empty: <dark_gray>[<red>Team</red>]</dark_gray> <gray>Für 
        <yellow>%player%</yellow> wurden keine Einträge gefunden.</gray>
      invalid-page: <dark_gray>[<red>Team</red>]</dark_gray> <red>Diese Seite 
        ist ungültig.</red>
  mute:
    default-reason: Kein Grund angegeben
    blocked-message: '<dark_gray>[<green>SMP</green>]</dark_gray> <red>Du bist %remaining%
      gemutet.</red> <gray>Grund: <white>%reason%</white></gray>'
    # Ein normaler Mute sperrt den öffentlichen Chat und alle hier eingetragenen
    # Kommunikationsbefehle. Befehle mit Namespace (z. B. /minecraft:tell) werden
    # ebenfalls anhand ihres eigentlichen Befehlsnamens erkannt.
    communication:
      block-public-chat: true
      block-commands: true
      commands:
      - msg
      - message
      - tell
      - whisper
      - w
      - reply
      - r
      - cc
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/mute
        <Spieler> [Grund]</yellow></gray>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde permanent gemutet.</green>
      already-muted: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist bereits gemutet.</red>
      self: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst dich nicht 
        selbst muten.</red>
      hierarchy: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst 
        <yellow>%player%</yellow> aufgrund der Ranghierarchie nicht muten.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Mute 
        konnte wegen eines Datenbankfehlers nicht gespeichert werden.</red>
  tempmute:
    default-reason: Kein Grund angegeben
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/tempmute
        <Spieler> <Zeit> [Grund]</yellow></gray>'
      invalid-duration: '<dark_gray>[<red>Team</red>]</dark_gray> <red>Ungültige Zeit.
        Beispiele: <yellow>30m, 2h, 7d, 3w, 6mo, 1y</yellow></red>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde für <yellow>%duration%</yellow> 
        gemutet.</green>
      already-muted: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist bereits gemutet.</red>
      self: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst dich nicht 
        selbst muten.</red>
      hierarchy: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst 
        <yellow>%player%</yellow> aufgrund der Ranghierarchie nicht muten.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Tempmute 
        konnte wegen eines Datenbankfehlers nicht gespeichert werden.</red>
  unmute:
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/unmute
        <Spieler></yellow></gray>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde erfolgreich entmutet.</green>
      not-muted: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist nicht gemutet.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Mute 
        konnte wegen eines Datenbankfehlers nicht aufgehoben werden.</red>
  tempban:
    default-reason: Kein Grund angegeben
    screen: '<red><bold>Du bist temporär von diesem Server ausgeschlossen.</bold></red>


      <gray>Grund:</gray>

      <white>%reason%</white>


      <gray>Gebannt von:</gray>

      <white>%moderator%</white>


      <gray>Verbleibende Zeit:</gray>

      <white>%remaining%</white>'
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/tempban
        <Spieler> <Zeit> [Grund]</yellow></gray>'
      invalid-duration: '<dark_gray>[<red>Team</red>]</dark_gray> <red>Ungültige Zeit.
        Beispiele: <yellow>30m, 2h, 7d, 3w, 6mo, 1y</yellow></red>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde für <yellow>%duration%</yellow> 
        gebannt.</green>
      already-banned: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist bereits gebannt.</red>
      self: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst dich nicht 
        selbst bannen.</red>
      hierarchy: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst 
        <yellow>%player%</yellow> aufgrund der Ranghierarchie nicht 
        bannen.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Tempban 
        konnte wegen eines Datenbankfehlers nicht gespeichert werden.</red>
  unban:
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/unban
        <Spieler></yellow></gray>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde erfolgreich entbannt.</green>
      not-banned: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist nicht gebannt.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Ban 
        konnte wegen eines Datenbankfehlers nicht aufgehoben werden.</red>
  ban:
    default-reason: Kein Grund angegeben
    screen: '<red><bold>Du bist von diesem Server ausgeschlossen.</bold></red>


      <gray>Grund:</gray>

      <white>%reason%</white>


      <gray>Gebannt von:</gray>

      <white>%moderator%</white>


      <dark_gray>────────────────────</dark_gray>

      <gray>Hylonia SMP</gray>'
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/ban
        <Spieler> [Grund]</yellow></gray>'
      not-found: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> wurde nicht gefunden.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde erfolgreich permanent 
        gebannt.</green>
      already-banned: <dark_gray>[<red>Team</red>]</dark_gray> 
        <red><yellow>%player%</yellow> ist bereits permanent gebannt.</red>
      self: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst dich nicht 
        selbst bannen.</red>
      hierarchy: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst 
        <yellow>%player%</yellow> aufgrund der Ranghierarchie nicht 
        bannen.</red>
      storage-error: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Ban 
        konnte wegen eines Datenbankfehlers nicht gespeichert werden.</red>
  kick:
    default-reason: Kein Grund angegeben
    screen: '<red><bold>Du wurdest vom Server entfernt.</bold></red>


      <gray>Grund:</gray>

      <white>%reason%</white>


      <dark_gray>────────────────────</dark_gray>

      <gray>Hylonia SMP</gray>'
    messages:
      usage: '<dark_gray>[<red>Team</red>]</dark_gray> <gray>Benutzung: <yellow>/kick
        <Spieler> [Grund]</yellow></gray>'
      not-online: <dark_gray>[<red>Team</red>]</dark_gray> <red>Der Spieler 
        <yellow>%player%</yellow> ist nicht online.</red>
      success: <dark_gray>[<red>Team</red>]</dark_gray> 
        <green><yellow>%player%</yellow> wurde erfolgreich gekickt.</green>
      self: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst dich nicht 
        selbst kicken.</red>
      hierarchy: <dark_gray>[<red>Team</red>]</dark_gray> <red>Du kannst 
        <yellow>%player%</yellow> aufgrund der Ranghierarchie nicht 
        kicken.</red>
