    '1': {enabled: true, invites: 1, novo-keys: 1}
    '2': {enabled: true, invites: 2, novo-keys: 2}
    '3': {enabled: true, invites: 3, novo-keys: 3}
    '4': {enabled: true, invites: 5, novo-keys: 4}
    '5': {enabled: true, invites: 7, novo-keys: 5}
  messages:
    player-only: "<red>Nur Spieler können /ref verwenden.</red>"
    redeem-pending: "<green>Referral-Code gespeichert.</green> <gray>Die Empfehlung zählt, sobald du <white>%blocks% Blöcke</white>, <white>%mobs% Mobs</white> und <white>%advancements% Advancements</white> erreicht hast.</gray>"
