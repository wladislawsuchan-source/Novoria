heads:
  # Spieler-Köpfe: 25 % bei einem PvP-Kill, unabhängig von Schwert, Looting und Beruf.
  player-kill-chance: 0.25
  # Globale Kopfchance für Nicht-Jäger bei Kills mit beliebigen Schwertern.
  global-sword-chance: 0.002
  looting-relative-per-level: 0.2
  collection-rewards:
    enabled: true
    # trigger.type: COUNT oder PERCENT. delivery: CLAIM oder AUTO.
    # serial-slot muss je Reward eindeutig bleiben, damit Ersatz nur genau diese Kopie deaktiviert.
    rewards:
      merge-10:
        order: 1
        trigger:
          type: COUNT
          value: 10
        delivery: CLAIM
        serial-slot: 1
        item-id: merge_helm
        replacement-price: 100000
      merge-25:
        order: 2
        trigger:
          type: PERCENT
          value: 25
        delivery: CLAIM
        serial-slot: 2
        item-id: merge_helm
        replacement-price: 100000
      merge-60:
        order: 3
        trigger:
          type: PERCENT
          value: 60
        delivery: CLAIM
        serial-slot: 3
        item-id: merge_helm
        replacement-price: 100000
      master:
        order: 4
        trigger:
          type: PERCENT
          value: 100
        require-all: true
        delivery: CLAIM
        serial-slot: 100
        item-id: master_merge_helm
        replacement-price: 100000
  boss-multipliers:
    ELDER_GUARDIAN: 2.0
    WITHER: 3.0
    WARDEN: 5.0
    ENDER_DRAGON: 10.0
  variant-reroll-by-prestige:
    '3': 0.1
    '4': 0.2
    '5': 0.3
  missing-variant-weight-by-prestige:
    '4': 2.0
    '5': 4.0
  variant-reroll-disabled-families: []
  new-head-actionbar: <gold>✦ Neuer Kopf in deiner Kopfsammlung:</gold> <yellow>%head%</yellow> <dark_gray>•</dark_gray>
    <gray>%current%/%total%</gray>
  collection-complete-message: <light_purple><bold>✦ Kopfsammlung vollständig!</bold></light_purple> <gray>Deine 
    100%-Belohnung ist jetzt freigeschaltet.</gray>
